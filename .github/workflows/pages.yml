# Builds the web app with the real Firebase web config and deploys it to GitHub Pages at
# https://bchmsl.github.io/Thread/ (owner-review-queue Q7, README "Deploy").
# The config comes from four Actions secrets. The build stops when one is missing, so a build for the local
# emulators is never deployed. The values are not printed, but they end up in the public bundle by design.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A running deploy finishes before the next one starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The JDK the project builds with (adr/ADR-001-build-baseline.md).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The open-source cache, built on the GitHub Actions cache.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Write the Firebase web config
        shell: bash
        env:
          API_KEY: ${{ secrets.THREAD_FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ secrets.THREAD_FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ secrets.THREAD_FIREBASE_PROJECT_ID }}
          APP_ID: ${{ secrets.THREAD_FIREBASE_APP_ID }}
        run: |
          for name in API_KEY AUTH_DOMAIN PROJECT_ID APP_ID; do
            value="${!name}"
            if [[ ! "$value" =~ ^[A-Za-z0-9._:-]+$ ]]; then
              echo "::error::Secret THREAD_FIREBASE_${name} is empty or not a plain identifier. Stopping, so an emulator build is never deployed."
              exit 1
            fi
          done
          umask 077
          printf 'apiKey=%s\nauthDomain=%s\nprojectId=%s\nappId=%s\n' \
            "$API_KEY" "$AUTH_DOMAIN" "$PROJECT_ID" "$APP_ID" > firebase/web-config.properties

      # JS tests only: the iOS targets of shared:domain cannot build on Linux. Tests named *Emulator* are skipped
      # without -Pthread.emulatorTests, so no Firebase emulator is needed. Browser tests use the runner's Chrome.
      - name: Lint and test
        run: ./gradlew ktlintCheck jsTest --console=plain

      - name: Build the production bundle
        run: ./gradlew :webApp:jsBrowserDistribution --console=plain

      - name: Drop source maps
        run: find webApp/build/dist/js/productionExecutable -name '*.map' -type f -delete

      - uses: actions/upload-pages-artifact@v5
        with:
          path: webApp/build/dist/js/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
