<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thread · pilot prototype</title>
<style>
:root{color-scheme:dark;--bg:#131419;--rail:#101116;--panel:#1c1e26;--line:#333542;--text:#f4f0fb;--muted:#adaabf;--violet:#d0bfff;--mint:#a9dfc2;--peach:#ffcbad;--blue:#a9d5f6;--rose:#f3b8cf;font:15px/1.5 system-ui,sans-serif;color:var(--text);background:var(--bg)}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer;background:#292b36;border:1px solid transparent;border-radius:9px;padding:7px 11px}button:hover{background:#37394a}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[contenteditable]:focus-visible,summary:focus-visible{outline:2px solid var(--violet);outline-offset:3px}a{color:var(--violet)}h1,h2,h3,p{margin:0}h1{font-size:clamp(29px,5vw,43px);line-height:1.05;letter-spacing:-.052em}h2{font-size:17px}h3{font-size:15px}small,.small{font-size:12px;color:var(--muted)}[hidden]{display:none!important}
.shell{display:grid;grid-template-columns:172px minmax(0,1fr);min-height:100dvh}.rail{background:var(--rail);border-right:1px solid var(--line);padding:20px 11px;display:flex;flex-direction:column;gap:16px}.brand{font-size:21px;font-weight:750;padding:0 9px}.brand b{color:var(--violet);margin-right:5px}.rail nav{display:grid;gap:4px}.rail nav button{background:transparent;text-align:left;color:var(--muted);display:flex;gap:9px;align-items:center}.rail nav button[aria-current]{color:var(--violet);background:#2c2540;box-shadow:inset 2px 0 var(--violet)}.icon{display:inline-grid;place-items:center;width:19px;height:19px;flex:none;font-family:system-ui,sans-serif;font-weight:700}.rail .lower{margin-top:auto}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:10px clamp(14px,3vw,30px);border-bottom:1px solid var(--line);min-height:55px}.toolbar .actions,.row,.between,.chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.main{max-width:1160px;margin:auto;padding:25px clamp(14px,3vw,32px) 42px;min-width:0}.primary{background:var(--violet);color:#251841;font-weight:720}.primary:hover{background:#e0d3ff}.quiet{background:transparent;color:var(--muted)}.danger{color:#ffb3b7}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:22px}.kicker{color:var(--muted);font-size:12px;margin-bottom:5px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;min-width:0}.stack{display:grid;gap:13px}.today{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start;gap:14px}.agenda h3{color:var(--muted);font-size:12px;margin-top:13px}.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{accent-color:var(--violet);margin:6px 0 0}.task button,.text-button{background:none;padding:0;text-align:left;border:0;font-weight:650}.task button:hover,.text-button:hover{color:var(--violet);background:transparent}.done{text-decoration:line-through;opacity:.63}.chip{display:inline-block;background:#303240;border-radius:6px;padding:2px 7px;font-size:12px}.chip.topic{color:var(--topic);background:color-mix(in srgb,var(--topic) 13%,var(--panel))}.reminder{background:#2b2235}.clock{font-size:25px;color:var(--violet);font-weight:750}.pr{background:#161c24;border:1px solid #394658;border-radius:9px;padding:10px;margin-top:8px}.pr-heading{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:7px;align-items:start}.open{background:#27663d;color:white;border-radius:14px;padding:1px 7px;font-size:12px}.active-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.active-list button{border-left:2px solid var(--topic);text-align:left}.active-list small{display:block}.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}.lane{flex:1 0 150px;background:#1a1b22;border-top:2px solid var(--status);border-radius:10px;padding:10px;min-height:220px}.lane h2{color:var(--status);margin-bottom:8px;font-size:13px}.topic-card{padding:9px;background:#292b35;border-left:3px solid var(--topic);border-radius:7px;margin-bottom:8px}.topic-card select{margin-top:7px}.list-row{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(80px,.7fr) minmax(0,1fr) auto;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}.details{max-width:800px}.details details{border-bottom:1px solid var(--line);padding:11px 0}.details summary{cursor:pointer;font-weight:650}.details details>div{padding:9px 0}.notebook{display:grid;grid-template-columns:178px minmax(0,1fr);gap:14px}.index{display:grid;gap:5px;align-content:start}.index button{text-align:left}.index .selected{background:#3a3028;color:#f3d7a4}.paper{background:#26231f;border:1px solid #4d4234;border-radius:10px;padding:clamp(14px,3vw,25px);min-width:0}.paper input.title{background:transparent;border:0;font:700 27px Georgia,serif;color:#f6e6c9;padding:3px 0;width:100%}.format{margin:9px 0;display:flex;gap:4px;flex-wrap:wrap}.format button{padding:4px 7px;background:#3a3028}.editable{min-height:145px;color:#eee1ce;padding:9px 0;overflow-wrap:anywhere}.editable p{margin:0 0 8px}.inbox{display:grid;grid-template-columns:minmax(145px,.8fr) minmax(0,1.2fr);gap:14px;align-items:start}.triage{background:#2c253c;border-color:#514465}.triage h2{font-size:23px;line-height:1.12}.ticket{border-left:2px solid var(--blue);padding:8px 10px;background:#1b2532;border-radius:7px;margin-top:7px}.ticket b{color:var(--blue);margin-right:7px}.banner{background:#352b3c;border:1px solid #594760;border-radius:9px;padding:10px;margin:9px 0;color:#f5d9ee}.form{display:grid;gap:9px}.form label{display:grid;gap:3px}.form label.inline{display:flex;align-items:center;gap:6px}.form input:not([type=checkbox]),.form select,.form textarea,select,input[type=search]{background:#15161d;border:1px solid #414454;border-radius:7px;padding:6px 8px;min-width:0;max-width:100%}.form select[multiple]{min-height:85px}.pane-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,1fr);gap:13px;align-items:start}.pane{background:#1d2129;border:1px solid #404653;border-radius:12px;padding:14px;min-width:0}.pane p{margin:7px 0}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tabs .selected{background:#42345d;color:var(--violet)}.welcome{max-width:545px;margin:clamp(15px,8vw,70px) auto;text-align:center;padding:30px;background:linear-gradient(145deg,#2c223b,#191b24 75%);border:1px solid #4d3d61;border-radius:18px}.welcome h1,.welcome p{margin:9px 0 16px}.empty{padding:20px;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.status-list{display:grid;gap:7px}.status-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:5px;align-items:center}.status-row .label{font-size:12px}.toast{position:fixed;bottom:12px;right:12px;max-width:calc(100% - 24px);background:#303443;color:#f6f2ff;border:1px solid #555b71;padding:9px 13px;border-radius:9px;z-index:3}
dialog{color:var(--text);background:#1d1f29;border:1px solid #494c62;border-radius:13px;padding:16px;width:min(94vw,530px);max-height:85dvh;overflow:auto}dialog::backdrop{background:#0009}dialog header{margin-bottom:11px}.search-results{display:grid;gap:5px;margin-top:9px}.search-results button{text-align:left}.search-results h3{margin-top:5px;color:var(--muted)}.focus-readout{font:700 34px/1.2 system-ui;color:var(--violet);font-variant-numeric:tabular-nums}
@media(max-width:900px){.shell{grid-template-columns:132px minmax(0,1fr)}.pane-layout{grid-template-columns:minmax(0,1fr)}}
@media(max-width:650px){.context-pane .context-underlay{display:none}.shell{display:block}.rail{padding:8px 10px;gap:4px;border-bottom:1px solid var(--line)}.rail nav{display:flex;flex-wrap:wrap}.rail nav button{padding:5px}.rail .lower{margin-top:0}.brand{font-size:17px}.today,.notebook,.inbox{grid-template-columns:minmax(0,1fr)}.index{display:flex;flex-wrap:wrap}.list-row{grid-template-columns:minmax(0,1fr) auto}.list-row .next{grid-column:1}.toolbar{flex-wrap:wrap}.main{padding-top:17px}.status-row{grid-template-columns:minmax(0,1fr) auto auto}.status-row .label{grid-column:1/-1}}
</style></head>
<body>
<div class="shell">
<aside class="rail"><div class="brand"><b aria-hidden="true">◆</b>Thread</div><nav id="nav" aria-label="Workspace"></nav>
<div class="lower"><button id="focus-trigger" data-action="focus"><span class="icon" aria-hidden="true">◷</span> Focus</button></div></aside>
<div><header class="toolbar"><span class="small" id="location">Workspace / Today</span><div class="actions"><button data-action="search" aria-keyshortcuts="Meta+K Control+K">⌕ Search <small>⌘K</small></button><button class="primary" data-action="capture">＋ New</button></div></header>
<main class="main" id="view"><header class="head"><div><p class="kicker">Thread · Demo workspace</p><h1>Today</h1></div></header><p class="small">Opening the prototype…</p></main></div>
</div>
<dialog id="modal"><header class="between"><h2 id="modal-title"></h2><button data-action="close" aria-label="Close">×</button></header><div id="modal-body"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body></html>
