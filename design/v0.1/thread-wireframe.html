<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thread — design proposal v0.1</title><style>body{margin:0}body>div{max-width:1440px;margin:auto}</style></head><body>
<div id="thread-wireframe" aria-label="Thread workspace design proposal">
<style>
#thread-wireframe{--paper:#fff;--canvas:#fafaf8;--rail:#f3f3f0;--ink:#292b2a;--secondary:#727570;--line:#e6e7e2;--selected:#e5e7e1;--blue:#37699c;--orange:#a86a22;--green:#477355;--space:24px;color-scheme:light;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
#thread-wireframe *{box-sizing:border-box}#thread-wireframe button,#thread-wireframe input,#thread-wireframe select{font:inherit;color:inherit}#thread-wireframe button{cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:7px 11px}#thread-wireframe button:hover{background:var(--rail)}#thread-wireframe button:focus-visible,#thread-wireframe input:focus-visible,#thread-wireframe select:focus-visible,#thread-wireframe summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}#thread-wireframe button[aria-current=page],#thread-wireframe button[aria-pressed=true]{background:var(--selected)}#thread-wireframe .quiet{border:0;background:transparent}#thread-wireframe .meta{font-size:12px;color:var(--secondary)}#thread-wireframe .proposal{display:flex;flex-wrap:wrap;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--canvas);font-size:12px;color:var(--secondary)}#thread-wireframe .shell{display:grid;grid-template-columns:166px minmax(0,1fr);min-height:660px}#thread-wireframe .sidebar{padding:24px 12px;background:var(--rail);display:flex;flex-direction:column;gap:24px}#thread-wireframe .brand{font-size:19px;letter-spacing:-.5px;padding:0 10px;font-weight:500}#thread-wireframe nav{display:grid;gap:4px}#thread-wireframe nav button{text-align:left;border:0;background:transparent;display:flex;justify-content:space-between}#thread-wireframe nav button:disabled{opacity:.55;cursor:default}#thread-wireframe .utilities{margin-top:auto;display:grid;gap:7px}#thread-wireframe .workspace{min-width:0}#thread-wireframe .topbar{min-height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px var(--space)}#thread-wireframe .topbar span{font-size:12px;color:var(--secondary)}#thread-wireframe .content{padding:28px var(--space);min-width:0}#thread-wireframe h1{font-size:28px;line-height:1.2;font-weight:500;letter-spacing:-.8px;margin:0}#thread-wireframe h2{font-size:15px;font-weight:500;margin:0}#thread-wireframe p{margin:0}#thread-wireframe .heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:28px}#thread-wireframe .stack{display:grid;gap:28px}#thread-wireframe .section-title{display:flex;gap:10px;align-items:center;margin-bottom:10px}#thread-wireframe .count{font-size:12px;color:var(--secondary)}#thread-wireframe .task{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:start;gap:9px;padding:12px 0;border-bottom:1px solid var(--line)}#thread-wireframe .task input{margin:5px 0 0;accent-color:var(--green);width:15px;height:15px}#thread-wireframe .task.done .task-label{text-decoration:line-through;color:var(--secondary)}#thread-wireframe .task-label{display:block}#thread-wireframe .context{padding:0;border:0;background:transparent;font-size:12px;color:var(--secondary);text-align:left}#thread-wireframe .date{font-size:12px;color:var(--secondary);white-space:nowrap}#thread-wireframe .late{color:var(--orange)}#thread-wireframe .row{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}#thread-wireframe .inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#thread-wireframe .badge{display:inline-flex;gap:5px;align-items:center;font-size:12px;white-space:nowrap}#thread-wireframe .badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}#thread-wireframe .active{color:var(--blue)}#thread-wireframe .paused{color:var(--orange)}#thread-wireframe .done-status{color:var(--green)}#thread-wireframe .planned{color:var(--secondary)}#thread-wireframe .review{background:var(--canvas);padding:16px;border-radius:8px}#thread-wireframe .review .row:last-child{border-bottom:0}#thread-wireframe .list-row{display:grid;grid-template-columns:minmax(140px,1.3fr) 90px minmax(100px,1fr) 54px;gap:15px;align-items:center;padding:17px 0;border-bottom:1px solid var(--line)}#thread-wireframe .list-head{font-size:12px;color:var(--secondary);padding:10px 0}#thread-wireframe .topic-link{padding:0;border:0;background:transparent;text-align:left;font-weight:500}#thread-wireframe .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}#thread-wireframe .column{background:var(--canvas);padding:12px;border-radius:8px;min-height:260px}#thread-wireframe .topic-card{padding:13px;background:var(--paper);border:1px solid var(--line);border-radius:7px;margin-top:12px;display:grid;gap:12px}#thread-wireframe .topic-card select{width:100%;font-size:12px;border:1px solid var(--line);border-radius:5px;background:var(--paper);padding:4px}#thread-wireframe .detail-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}#thread-wireframe .detail-layout.with-panel{grid-template-columns:minmax(0,1fr) minmax(235px,.85fr)}#thread-wireframe details{border-bottom:1px solid var(--line);padding:0 0 18px;margin-bottom:20px}#thread-wireframe summary{font-weight:500;cursor:pointer;margin-bottom:12px}#thread-wireframe .continuation{background:var(--canvas);padding:16px;border-radius:8px;margin-bottom:22px;display:grid;gap:14px}#thread-wireframe .external-panel{border-left:1px solid var(--line);padding-left:20px;min-width:0}#thread-wireframe .external-panel h2{font-size:19px;margin:18px 0}#thread-wireframe .external-panel .properties{display:grid;grid-template-columns:75px 1fr;gap:10px;font-size:12px;margin:20px 0}#thread-wireframe .external-panel .comment{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}#thread-wireframe .note-preview{padding:14px;background:var(--canvas);border-radius:7px}#thread-wireframe .popover{background:var(--paper);border:1px solid var(--line);padding:12px;border-radius:8px;display:grid;gap:8px}#thread-wireframe .capture{display:flex;gap:8px;margin:14px 0}#thread-wireframe .capture input{min-width:0;flex:1;padding:8px;border:1px solid var(--line);border-radius:6px}#thread-wireframe .empty{padding:30px 0;color:var(--secondary)}
@media(max-width:800px){#thread-wireframe .board{grid-template-columns:repeat(2,minmax(0,1fr))}#thread-wireframe .detail-layout.with-panel{grid-template-columns:1fr}#thread-wireframe .external-panel{border-left:0;border-top:1px solid var(--line);padding:20px 0 0}}
@media(max-width:540px){#thread-wireframe .shell{grid-template-columns:1fr}#thread-wireframe .sidebar{padding:12px;gap:10px}#thread-wireframe nav{display:flex;flex-wrap:wrap}#thread-wireframe .sidebar .utilities{display:none}#thread-wireframe .brand{padding:0}#thread-wireframe .content{padding:22px 16px}#thread-wireframe .list-row{grid-template-columns:minmax(0,1fr) 80px}#thread-wireframe .list-row>*:nth-child(3){grid-column:1}#thread-wireframe .list-head{display:none}#thread-wireframe .board{grid-template-columns:1fr}#thread-wireframe .task{grid-template-columns:20px minmax(0,1fr)}#thread-wireframe .date{grid-column:2}#thread-wireframe button{min-height:40px}}
</style>
<div class="proposal"><span>DESIGN PROPOSAL · v0.1</span><span>Synthetic data · Nov 12, 2026 · No live sync</span></div>
<div class="shell">
<aside class="sidebar"><div class="brand">Thread <span class="meta">/ working title</span></div><nav aria-label="Workspace"><button data-screen="today" aria-current="page">Today <span>4</span></button><button disabled>Inbox</button><button data-screen="topics">Topics</button><button disabled>Notes</button><button disabled>Jira</button><button disabled>Pull Requests</button></nav><div class="utilities"><button id="tw-focus">◷ Focus · 25:00</button><div id="tw-focus-panel" hidden></div><span class="meta">Bachana · Personal workspace</span></div></aside>
<main class="workspace"><div class="topbar"><span id="tw-breadcrumb">Workspace / Today</span><span>Comfortable · Desktop draft</span></div><div class="content" id="tw-content"></div></main>
</div>
<script>
(()=>{
const root=document.getElementById('thread-wireframe');
const area=root.querySelector('#tw-content');
const topics=[{id:'qr',title:'Implement QR payments',status:'Active',next:'Test timeout handling',goal:'Let customers scan a QR code and complete a payment with clear recovery from errors.'},{id:'bills',title:'Improve bill payment errors',status:'Active',next:'Review error copy',goal:'Make payment failures clear and actionable.'},{id:'api',title:'Confirm recurring payment API',status:'Paused',next:'Wait for backend contract',goal:'Agree on a stable API contract.'},{id:'tests',title:'Add payment mapper tests',status:'Planned',next:'List edge cases',goal:'Cover the mapper’s important edge cases.'},{id:'receipt',title:'Update payment receipt',status:'Done',next:'Released and verified',goal:'Clarify receipt details.'}];
const tasks=[{id:'timeout',title:'Test timeout and retry handling',topic:'qr',group:'today',due:'Today · 17:00',done:false},{id:'copy',title:'Review payment error copy',topic:'bills',group:'today',due:'Planned today',done:false},{id:'codes',title:'Confirm backend error codes',topic:'qr',group:'overdue',due:'Due Nov 11',done:false},{id:'scan',title:'Check camera permission fallback',topic:'qr',group:'earlier',due:'Planned Nov 11',done:false},{id:'scan-done',title:'Connect scanner result to payment flow',topic:'qr',group:'other',due:'',done:true}];
let state={screen:'today',view:'list',topic:'qr',panel:null};
const saved=window.openai?.widgetState?.privateContent;
if(saved&&['today','topics','detail'].includes(saved.screen))state={...state,...saved,panel:null};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=s=>`<span class="badge ${s==='Done'?'done-status':s.toLowerCase()}">${s}</span>`;
const topic=id=>topics.find(t=>t.id===id)||topics[0];
function persist(){window.openai?.setWidgetState?.({modelContent:{design:'Thread v0.1',screen:state.screen,view:state.view},privateContent:state})?.catch(()=>{});}
function taskRow(t){return `<div class="task ${t.done?'done':''}"><input type="checkbox" data-task="${t.id}" aria-label="Complete ${esc(t.title)}" ${t.done?'checked':''}><div><span class="task-label">${esc(t.title)}</span>${t.topic?`<button class="context" data-topic="${t.topic}">${esc(topic(t.topic).title)}</button>`:'<span class="meta">Standalone · Inbox</span>'}</div><span class="date ${t.group==='overdue'?'late':''}">${t.due}</span></div>`;}
function group(title,key){const items=tasks.filter(t=>t.group===key);return `<section><div class="section-title"><h2>${title}</h2><span class="count">${items.filter(t=>!t.done).length}</span></div>${items.map(taskRow).join('')}</section>`;}
function today(){return `<div class="heading"><div><p class="meta">Thursday, November 12</p><h1>Today</h1></div><button data-capture>+ Add task</button></div><div id="tw-capture"></div><div class="stack">${group('Overdue','overdue')}${group('Planned today','today')}${group('Earlier planned','earlier')}<section><div class="section-title"><h2>Reminders</h2><span class="count">1</span></div><div class="row"><div><p>Follow up on the backend contract</p><button class="context" data-topic="api">Confirm recurring payment API</button></div><span class="date">16:30</span></div></section><section class="review"><div class="section-title"><h2>Review requested</h2><span class="count">1</span></div><div class="row"><div><button class="topic-link" data-review>Handle QR payment timeout</button><p class="meta">#248 · android-payments · Alex</p></div><span class="badge done-status">CI passed</span></div><p class="meta">Your review requested · Cached 5 min ago</p></section></div>`;}
function progress(t){const tt=tasks.filter(a=>a.topic===t.id);return tt.length?`${tt.filter(a=>a.done).length}/${tt.length}`:'0/0';}
function listing(){return `<div class="heading"><div><p class="meta">Your work, in context</p><h1>Topics</h1></div><div class="inline"><button data-view="list" aria-pressed="${state.view==='list'}">List</button><button data-view="board" aria-pressed="${state.view==='board'}">Board</button></div></div>${state.view==='list'?`<div class="list-row list-head"><span>Topic</span><span>Status</span><span>Next step</span><span>Tasks</span></div>${topics.map(t=>`<div class="list-row"><button class="topic-link" data-topic="${t.id}">${t.title}</button>${badge(t.status)}<span class="meta">${t.next}</span><span class="meta">${progress(t)}</span></div>`).join('')}`:`<div class="board">${['Planned','Active','Paused','Done'].map(s=>`<section class="column" data-column="${s}"><div class="inline">${badge(s)}<span class="count">${topics.filter(t=>t.status===s).length}</span></div>${topics.filter(t=>t.status===s).map(t=>`<article class="topic-card" draggable="true" data-drag="${t.id}"><button class="topic-link" data-topic="${t.id}">${t.title}</button><p class="meta">${t.next}</p><p class="meta">${progress(t)} personal tasks</p><select data-status="${t.id}" aria-label="Status for ${t.title}">${['Planned','Active','Paused','Done'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></article>`).join('')}</section>`).join('')}</div>`}`;}
function external(){const pr=state.panel==='pr';return `<aside class="external-panel" aria-label="${pr?'Pull request':'Jira issue'} details"><div class="inline"><span class="meta">${pr?'PULL REQUEST · #248':'JIRA · PAY-142'}</span><button class="quiet" data-close aria-label="Close details">Close ×</button></div><h2>${pr?'Handle QR payment timeout':'Handle QR payment response'}</h2>${badge('Active')}<div class="properties"><span class="meta">${pr?'Author':'Assignee'}</span><span>${pr?'Alex':'Bachana'}</span><span class="meta">${pr?'Checks':'Priority'}</span><span>${pr?'All checks passed':'Medium'}</span></div><p class="meta">Cached snapshot · Refreshed 5 min ago</p><hr><h3>Description</h3><p>${pr?'Adds a retry path for interrupted QR payments and maps timeout errors to a clear message.':'Map payment responses to success, pending and recoverable error states. Preserve the scanned payment context when retrying.'}</p><div class="comment"><p class="meta">Alex · 10:45</p><p>Timeout should keep the payment context so the customer can retry.</p></div><div class="comment"><p class="meta">Source action</p><button disabled>Open in ${pr?'GitHub':'Jira'} ↗</button><p class="meta">Synthetic item · no source URL</p></div></aside>`;}
function detail(){const t=topic(state.topic);return `<div class="heading"><div><button class="context" data-screen="topics">‹ Topics</button><h1>${t.title}</h1></div><select data-status="${t.id}" aria-label="Topic status">${['Planned','Active','Paused','Done'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div><p style="margin-bottom:24px" class="meta">${t.goal}</p><div class="detail-layout ${state.panel?'with-panel':''}"><div><div class="continuation"><div><p class="meta">Where I left off</p><p>${t.id==='qr'?'Scanner flow is connected. Response mapping is ready for edge-case testing.':t.next}</p></div><div><p class="meta">Next step</p><p>${t.next}</p></div></div><details open><summary>Tasks · ${progress(t)}</summary>${tasks.filter(a=>a.topic===t.id).map(taskRow).join('')||'<p class="meta">No tasks yet.</p>'}<button class="context" data-capture>+ Add task</button><div id="tw-capture"></div></details><details open><summary>Notes · ${t.id==='qr'?1:0}</summary>${t.id==='qr'?'<article class="note-preview"><p>QR payment decisions</p><p class="meta">Keep the scanned context after a timeout. Confirm whether retry needs a new request ID.</p><p class="meta" style="margin-top:10px">Preview only · Editor in a later design</p></article>':'<p class="meta">No linked notes.</p>'}</details><details open><summary>Jira · ${t.id==='qr'?1:0}</summary>${t.id==='qr'?'<button class="topic-link" data-external="jira">PAY-142 · Handle QR payment response</button><p class="meta">In progress · Cached 5 min ago</p>':'<p class="meta">No linked Jira tickets.</p>'}</details><details open><summary>Pull requests · ${t.id==='qr'?1:0}</summary>${t.id==='qr'?'<button class="topic-link" data-external="pr">#248 · Handle QR payment timeout</button><p class="meta">Review requested · CI passed</p>':'<p class="meta">No linked pull requests.</p>'}</details><details><summary>Reminders · ${t.id==='api'?1:0}</summary><p>${t.id==='api'?'16:30 · Follow up on the backend contract':'No reminders.'}</p></details></div>${state.panel?external():''}</div>`;}
function render(){area.innerHTML=state.screen==='today'?today():state.screen==='topics'?listing():detail();root.querySelector('#tw-breadcrumb').textContent=state.screen==='detail'?'Topics / '+topic(state.topic).title:'Workspace / '+(state.screen==='today'?'Today':'Topics');root.querySelectorAll('[data-screen]').forEach(b=>{if(b.closest('nav'))b.setAttribute('aria-current',b.dataset.screen===(state.screen==='detail'?'topics':state.screen)?'page':'false');});}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.screen){state.screen=b.dataset.screen;state.panel=null;}else if(b.dataset.view){state.view=b.dataset.view;}else if(b.dataset.topic){state.screen='detail';state.topic=b.dataset.topic;state.panel=null;}else if(b.hasAttribute('data-review')){state.screen='detail';state.topic='qr';state.panel='pr';}else if(b.dataset.external){state.panel=b.dataset.external;}else if(b.hasAttribute('data-close')){state.panel=null;}else if(b.hasAttribute('data-capture')){const box=root.querySelector('#tw-capture');box.innerHTML='<form class="capture"><input aria-label="Task title" placeholder="What needs to be done?" required><button type="submit">Add</button></form><p class="meta">'+(state.screen==='detail'?'Linked to this Topic':'Standalone · Inbox · Planned today')+'</p>';box.querySelector('input').focus();return;}else if(b.id==='tw-focus'){const p=root.querySelector('#tw-focus-panel');p.hidden=!p.hidden;p.innerHTML='<div class="popover"><p>Focus · 25 min</p><p class="meta">Break · 5 min</p><p class="meta">Control placement preview</p></div>';return;}else return;persist();render();});
root.addEventListener('submit',e=>{e.preventDefault();const input=e.target.querySelector('input');if(!input?.value.trim())return;tasks.push({id:'new-'+tasks.length,title:input.value.trim(),topic:state.screen==='detail'?state.topic:null,group:state.screen==='detail'?'other':'today',due:state.screen==='detail'?'':'Planned today',done:false});render();});
root.addEventListener('change',e=>{if(e.target.dataset.task){tasks.find(t=>t.id===e.target.dataset.task).done=e.target.checked;render();}if(e.target.dataset.status){topic(e.target.dataset.status).status=e.target.value;render();}});
root.addEventListener('dragstart',e=>{const card=e.target.closest('[data-drag]');if(card)e.dataTransfer.setData('text/plain',card.dataset.drag);});root.addEventListener('dragover',e=>{if(e.target.closest('[data-column]'))e.preventDefault();});root.addEventListener('drop',e=>{const col=e.target.closest('[data-column]');if(!col)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain');const t=topics.find(t=>t.id===id);if(t){t.status=col.dataset.column;render();}});
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s&&['today','topics','detail'].includes(s.screen)){state={...state,...s};render();}});
render();
})();
</script>
</div>

</body></html>
