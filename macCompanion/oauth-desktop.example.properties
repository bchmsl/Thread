# Google "Desktop app" OAuth client for Thread Calendar (adr/ADR-020-calendar-meetings-sync.md).
# Copy this file to macCompanion/oauth-desktop.properties, which git ignores, and fill in both values:
#   Google Cloud console of the Thread Firebase project > APIs & Services > Credentials >
#   Create credentials > OAuth client ID > Application type "Desktop app".
# Never paste the values into chat, an issue or a commit. scripts/build-app.sh reads them without printing.
# With no values here and none in firebase/web-config.properties, the build makes the emulator variant.
clientId=
clientSecret=
