<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- No page zoom (D48): with touch-action in app.css and ZoomGuard.kt. maximum-scale=1 also stops iOS zooming in on a focused field. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0e1322">
    <!-- Strict Content Security Policy (Phase 12, ADR-015). No inline or evaluated script. Hosts:
         Firebase Auth and Firestore (googleapis.com), Google sign-in popup (apis.google.com script,
         the project's firebaseapp.com auth iframe), read-only Jira (api.atlassian.com) and GitHub
         (api.github.com), and the local emulators on 127.0.0.1. data: images are the CSS check marks;
         www.google.com serves the 1-pixel image Firestore's connection test loads when the network fails. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self'; img-src 'self' data: https://www.google.com https://avatars.githubusercontent.com; font-src 'self'; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://api.atlassian.com https://api.github.com http://127.0.0.1:9099 http://127.0.0.1:8085; frame-src https://*.firebaseapp.com https://apis.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
    <title>Thread</title>
    <!-- Paths stay relative: the same build runs at / on 127.0.0.1 and at /Thread/ on GitHub Pages. -->
    <!-- App icon (D58): the hex mark on the ink tile. The SVG is for current browsers, the ICO and the 32 px PNG for
         the rest, the 180 px PNG for iOS home screens. All of them are in the offline shell. -->
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/thread.css">
</head>
<body>
<div id="root"></div>
<script src="thread.js"></script>
</body>
</html>
